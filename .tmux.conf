set -s escape-time 0
set -g base-index 1
set -g mouse on
set -g set-titles on
set -g set-titles-string "(tmux) #I: #T"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-move-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-option -g focus-events on
set-option -g default-terminal "tmux-256color"
set-option -aa terminal-overrides ',xterm-256color:RGB'

# https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

set -g status-position bottom
set -g status-justify left
set -g status-left ''
set -g status-left-length 50
set -g status-right ''
set -g status-right-length 50

set -g status-style 'bg=colour13 fg=black align=centre'
setw -g window-status-current-style 'fg=black bg=colour147 bold italics'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#F '

bind r source-file ~/.tmux.conf
